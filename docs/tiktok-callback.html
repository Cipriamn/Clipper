<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Clipper TikTok Login</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a href="index.html">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav>
<h1>TikTok login</h1>
<p id="msg" class="muted">Reading the login result…</p>
<div id="out" hidden>
<p>Copy this code and paste it into Clipper on your computer. It works once and expires in a few minutes.</p>
<p><code id="code" style="word-break:break-all;font-size:15px"></code></p>
<p><button id="copy" type="button">Copy code</button></p>
<p class="muted">This page runs only in your browser: it sends the code nowhere and stores nothing.</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var msg = document.getElementById("msg");
  var err = q.get("error"), code = q.get("code");
  if (err) {
    msg.textContent = "TikTok returned an error: " + err + (q.get("error_description") ? " (" + q.get("error_description") + ")" : "");
    return;
  }
  if (!code) { msg.textContent = "No login code on this page. Start the TikTok login from Clipper."; return; }
  msg.textContent = "Login approved" + (q.get("state") ? " (state " + q.get("state").slice(0, 8) + "…)" : "") + ".";
  document.getElementById("code").textContent = code;
  document.getElementById("out").hidden = false;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(code).then(function () { document.getElementById("copy").textContent = "Copied"; });
  };
  history.replaceState(null, "", location.pathname);  // keep the code out of browser history
})();
</script>
</body></html>
